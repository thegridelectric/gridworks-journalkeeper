name: Tests

on:
  push:
  pull_request:

jobs:
  ci:
    name: ci / 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run ci.sh
        run: ./ci.sh
