# Regenerate the snapshot after editing this seed:
#   scripts/regen_sema_snapshot.sh
# (runs `sema snapshot prepare <this file>` + `build --package-name gjk` in the
# sema repo, then mirrors output/sema -> src/gjk/sema). src/gjk/sema is
# generated — edit this seed, not the vendored output.
#
# initial_targets may contain only types and enums. Formats are never listed
# directly; they are pulled in through type dependencies.
#
# For each type or enum, choose exactly one of:
#   {}                         Use only the latest registry version.
#   include_all_versions: true Include every registry-declared version.
#   versions: ["001", "003"]   Include explicit versions. For types, seed
#                              expansion also fills in intermediate versions.

initial_targets:
  types:
    report.event:
      versions: ["000", "002", "003", "004"]
    layout.lite:
      # Every published version: gjk is a prod service, so its snapshot is
      # publication-grade. The walk-back extends this backward; 002/003 are
      # historical back-fill versions the S3 archive still carries and JK
      # must decode.
      versions: ["001", "002", "003", "004", "005", "006", "007", "008", "009", "010", "011", "012", "013"]
    glitch:
      include_all_versions: true
    flo.params.house0:
      include_all_versions: true
    gridworks.event.problem:
      include_all_versions: true
    power.watts:
      include_all_versions: true
    heating.forecast:
      include_all_versions: true
    weather.forecast:
      include_all_versions: true
    energy.instruction:
      include_all_versions: true
    new.command.tree:
      # Published set only (002 is staging) — same posture as layout.lite.
      versions: ["000", "001"]
    g.node.forest:      # grid-node-registry's broadcast projection
      include_all_versions: true
    g.node.forest.request:      # bootstrap/resync against gnr's read API
      include_all_versions: true
    snapshot.spaceheat:
      include_all_versions: true
    gw.house.operating.status:
      include_all_versions: true
    scada.params:
      include_all_versions: true
    # The commit a scada runs, announced once per run at boot.
    gw.scada.commit: {}
    ticklist.reed.report:
      include_all_versions: true
    ticklist.hall.report:
      include_all_versions: true
    report:
      include_all_versions: true
    atn.bid:            # historical (frozen) — old S3 atn.bid still decodes
      include_all_versions: true
    bid:                # current
      include_all_versions: true
    latest.price:
      include_all_versions: true
    # The gw.weather vocabulary, latest versions only: the service emits
    # nothing older, and an older version on the wire or in the archive is
    # retired (gjk/retired_versions.py), never decoded. Journaled
    # messages-table only; the readings projection comes later.
    gw.weather.observation: {}
    gw.weather.forecast: {}
    gw.weather.channel.gt: {}
    gw.weather.forecast.channel.gt: {}
    gw.weather.forecast.bundle.gt: {}
    gw.weather.location.gt: {}
    gw.weather.station.gt: {}
    gw.weather.seasonal.template.gt: {}
    gw.weather.create.cmd: {}
    gw.weather.cmd.ack: {}
    gw.weather.cmd.nack: {}
    # The alerter's words: the alert record (Firing / Resolved) and the
    # snapshot of houses whose alerts are not paged.
    gw.alert: {}
    gw.hack.alert.silences: {}

  enums:
    # What kind of thing each reading_channels row records.
    gw.channel.kind: {}
    # The pico-cycler's per-pico health rows in report.StateList.
    single.pico.state: {}
    gw1.unit: {}
    gw1.main.auto.state: {}
    gw1.lc.top.state: {}
    gw1.leaf.ally.all.tanks.state: {}
    gw1.leaf.ally.buffer.only.state: {}
    gw1.local.control.all.tanks.state: {}
    gw1.local.control.buffer.only.state: {}
    # Every enum a scada declares in layout.lite StateMachines: the report
    # persistor resolves a machine's states against the declared enum.
    aquastat.control.state: {}
    five.v.boss.state: {}
    gw.top.state: {}
    gw1.nolan.lc.buffer.only.state: {}
    gw2.lc.top.state: {}
    heat.pump.control: {}
    hp.boss.state: {}
    hp.loop.keep.send: {}
    pico.cycler.state: {}
    primary.pump.control: {}
    relay.closed.or.open: {}
    sieg.valve.state: {}
    spruce.hack.hp.state: {}
    store.flow.relay: {}
    valve.open.or.closed: {}
    zone.call.source: {}
